name: AtelierBot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: atelierbot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install "python-telegram-bot[job-queue]" cryptography

      - name: Verifier les secrets
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ATELIER_PASSWORD: ${{ secrets.ATELIER_PASSWORD }}
        run: |
          test -n "$DATA_KEY" || { echo "ERREUR: DATA_KEY manquant."; exit 1; }
          test -n "$BOT_TOKEN" || { echo "ERREUR: BOT_TOKEN manquant."; exit 1; }
          test -n "$ATELIER_PASSWORD" || { echo "ERREUR: ATELIER_PASSWORD manquant."; exit 1; }

      - name: Creer data.enc si absent
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
        run: |
          if [ -f data.enc ]; then
            echo "data.enc deja present."
          elif [ -f data.json ]; then
            echo "data.enc absent : chiffrement de la base existante."

            python - <<'PY'
          import json
          import os
          from pathlib import Path
          from cryptography.fernet import Fernet

          data_path = Path("data.json")
          raw = data_path.read_bytes()

          if not raw.strip():
              raise SystemExit("ERREUR: data.json est vide.")

          json.loads(raw)

          encrypted = Fernet(
              os.environ["DATA_KEY"].encode()
          ).encrypt(raw)

          Path("data.enc").write_bytes(encrypted)

          print("data.enc cree avec succes.")
          PY

            rm -f data.json

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add data.enc
            git rm --cached data.json 2>/dev/null || true

            git commit -m "chore: initialiser la base chiffree"
            git push

          else
            echo "ERREUR: ni data.enc ni data.json ne sont presents."
            exit 1
          fi

      - name: Dechiffrer la base privee
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          from pathlib import Path
          from cryptography.fernet import Fernet

          encrypted = Path("data.enc").read_bytes()

          plain = Fernet(
              os.environ["DATA_KEY"].encode()
          ).decrypt(encrypted)

          if not plain.strip():
              raise SystemExit(
                  "ERREUR: data.enc produit une base vide."
              )

          json.loads(plain)

          Path("data.json").write_bytes(plain)
          try:
              Path("data.json").chmod(0o600)
          except OSError:
              pass

          print("Base dechiffree et valide.")
          PY

      - name: Lancer AtelierBot pendant 5h30
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ATELIER_PASSWORD: ${{ secrets.ATELIER_PASSWORD }}
          MAX_RUNTIME_SECONDS: 19800
        run: |
          set +e

          python AtelierBot_PRO_PUBLIC_SECRET.py &
          BOT_PID=$!

          START_TIME=$(date +%s)
          STOPPED_BY_TIMEOUT=0

          while kill -0 "$BOT_PID" 2>/dev/null; do
            sleep 30

            NOW=$(date +%s)
            ELAPSED=$((NOW - START_TIME))

            if [ "$ELAPSED" -ge "$MAX_RUNTIME_SECONDS" ]; then
              echo "5h30 atteintes : arret programme du bot."
              STOPPED_BY_TIMEOUT=1

              kill -INT "$BOT_PID" 2>/dev/null || true
              sleep 10

              if kill -0 "$BOT_PID" 2>/dev/null; then
                echo "Le bot est encore actif : arret force."
                kill -TERM "$BOT_PID" 2>/dev/null || true
              fi

              break
            fi
          done

          wait "$BOT_PID"
          BOT_EXIT=$?

          if [ "$STOPPED_BY_TIMEOUT" -eq 1 ]; then
            echo "Arret programme apres 5h30. Code de sortie: $BOT_EXIT"
            exit 0
          fi

          if [ "$BOT_EXIT" -ne 0 ]; then
            echo "ERREUR: le bot s'est arrete avec le code $BOT_EXIT."
            exit "$BOT_EXIT"
          fi

          echo "Bot termine normalement."

      - name: Rechiffrer la base
        if: always()
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          from pathlib import Path
          from cryptography.fernet import Fernet

          plain = Path("data.json").read_bytes()

          if not plain.strip():
              raise SystemExit(
                  "ERREUR: data.json est vide, data.enc ne sera PAS remplace."
              )

          json.loads(plain)

          encrypted = Fernet(
              os.environ["DATA_KEY"].encode()
          ).encrypt(plain)

          Path("data.enc").write_bytes(encrypted)

          print("Base validee et rechiffree.")
          PY

      - name: Nettoyer les fichiers temporaires
        if: always()
        run: |
          chmod 600 data.json 2>/dev/null || true
          rm -f data.json
          rm -rf backups

      - name: Sauvegarder uniquement data.enc
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.enc

          if git diff --cached --quiet; then
            echo "Aucune modification de data.enc."
          else
            git commit -m "chore: mise a jour de la base chiffree"
            git push
          fi
